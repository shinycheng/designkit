name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          want="$(sed -n 's/^go //p' backend/go.mod)"
          go version | grep -qF "go${want} "
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  # designkit 图像预处理服务（Python）。跑 selfcheck.py 的「本地」段：
  # 不起 HTTP、不联网、不花钱，验的是 fail-closed、五个比例的画布计算、
  # 以及高清放大的推理往返（模型文件在仓库里，忘了提交这里会当场红）。
  # DK_SELFCHECK_REQUIRE_UPSCALE=1：CI 上放大依赖必须可用，
  # 缺了直接判失败，不允许被「跳过」悄悄盖住（selfcheck.py 文档里点名要求）。
  imgsvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: designkit/imgsvc/requirements.txt
      - name: Install imgsvc dependencies
        working-directory: designkit/imgsvc
        run: pip install -r requirements.txt
      - name: imgsvc selfcheck (local segment)
        working-directory: designkit/imgsvc
        env:
          DK_SELFCHECK_REQUIRE_UPSCALE: '1'
        run: python3 selfcheck.py --local-only

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          want="$(sed -n 's/^go //p' backend/go.mod)"
          go version | grep -qF "go${want} "
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
