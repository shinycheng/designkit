version: 1
# 说明（给维护者，CI 只读结构化字段）：
# - 这里只保留「确实无法升级」的漏洞豁免；能升级的一律升级，不进这个文件。
# - lodash / lodash-es / axios 的旧条目已删除：锁定版本已不受对应 advisory 影响
#   （lodash 系列 >=4.18.0 已修 GHSA-r5fr-rjxr-66jc；axios 1.18.1 已包含
#   GHSA-3p68-rc4w-qgx5 与 GHSA-pmwg-cvhr-8vh7 的修复）。
# - xlsx 两条保留：npm 渠道最新就是 0.18.5，修复版（0.19.3 / 0.20.2）只发布在
#   cdn.sheetjs.com，无法通过 pnpm 正常升级，属于上游锁死。
exceptions:
  - package: xlsx
    advisory: "GHSA-4r6h-8v6p-xvw6"
    severity: high
    reason: "No fixed release on npm (latest is 0.18.5; fix 0.19.3 only on cdn.sheetjs.com). Admin export only, loaded via dynamic import (CVE-2023-30533)"
    mitigation: "Load only on export; restrict export permissions and data scope"
    expires_on: "2026-11-21"
    owner: "designkit"
  - package: xlsx
    advisory: "GHSA-5pgg-2g8v-p4x9"
    severity: high
    reason: "No fixed release on npm (fix 0.20.2 only on cdn.sheetjs.com). Admin export only, loaded via dynamic import (CVE-2024-22363)"
    mitigation: "Load only on export; restrict export permissions and data scope"
    expires_on: "2026-11-21"
    owner: "designkit"
