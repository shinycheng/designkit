services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 里设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER}
      # 故意不给默认值：没设置就直接启动失败，避免默认弱口令被带上生产
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 必须带 -h 走 TCP：不加的话 initdb 阶段的临时本地服务也会被判为健康，
      # 应用会在数据库真正就绪前抢跑，首次建表失败
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    # 数据库只在 compose 内部网络可达，不对外开端口。
    # 需要用外部工具连库（如迁移脚本）时，在宿主机上开 SSH 隧道即可。

  designkit:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 分开传，不拼连接串：密码里有 @ % 等字符时拼 URL 会解析错，
      # 报的却是「主机连不上」，非常难排查。应用侧用 URL.create 组装并自动转义。
      DESIGNKIT_DB_HOST: db
      DESIGNKIT_DB_PORT: "5432"
      DESIGNKIT_DB_NAME: ${POSTGRES_DB}
      DESIGNKIT_DB_USER: ${POSTGRES_USER}
      DESIGNKIT_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 默认监听所有网卡，这样同一局域网的电脑/手机/ERP 都能访问（NAS 部署的常见需求）。
      # ⚠️ 前提是这台机器没有把 8787 端口转发到公网——直接暴露公网意味着
      # 登录密码明文传输。确需公网访问请在前面加 Nginx/Caddy 并配 HTTPS。
      # 只想本机访问就在 .env 里设 DESIGNKIT_BIND_HOST=127.0.0.1
      - "${DESIGNKIT_BIND_HOST:-0.0.0.0}:${DESIGNKIT_HOST_PORT:-8787}:8787"
    volumes:
      # 上传图与生成图仍在文件系统里，数据库存的是相对路径
      - ./data:/app/data
    # NAS 上共享文件夹通常归特定用户所有，容器内用户 uid 对不上就会写不进去。
    # 在 .env 里把 PUID/PGID 设成 NAS 上该文件夹的属主即可（群晖常见为 1026）。
    user: "${PUID:-10001}:${PGID:-10001}"
    env_file:
      - .env
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
