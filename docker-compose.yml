#
# DesignKit —— 把这个文件和 .env 放进 NAS 的同一个文件夹，然后执行：
#     docker compose up -d
#
# 不用下载源码，也不用在 NAS 上编译，镜像是 GitHub 自动构建好的现成镜像。
#

name: designkit

services:
  designkit:
    container_name: designkit
    image: ghcr.io/shinycheng/designkit:${DESIGNKIT_VERSION:-latest}
    env_file:
      - .env
    environment:
      # 分开传连接参数而不拼连接串：密码里有 @ % 等字符时拼 URL 会解析错，
      # 报的却是「主机连不上」，非常难排查。应用侧用 URL.create 组装并自动转义。
      DESIGNKIT_DB_HOST: db
      DESIGNKIT_DB_PORT: "5432"
      DESIGNKIT_DB_NAME: ${POSTGRES_DB:-designkit}
      DESIGNKIT_DB_USER: ${POSTGRES_USER:-designkit}
      DESIGNKIT_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # 商品原图与生成图存这里。冒号左边是 NAS 上的路径，右边不要改。
      # 用绑定目录（不是 docker 卷）是为了让你能在 File Station 里直接看到图。
      #
      # ⚠️ 这个目录里还有两个隐藏文件（File Station 默认看不见），备份必须带上：
      #   .secret_key —— 登录令牌与 ERP 回调签名的主密钥
      #   .enc_key    —— 解开成员个人网关 Key 的钥匙，丢了「全体突然都不能生图」
      # 所以备份要 tar 整个目录，不要只挑里面的图片文件夹。
      - ${DESIGNKIT_DATA_LOCATION:-./data}:/app/data
    ports:
      # 默认监听所有网卡，同局域网的电脑、手机、ERP 都能访问。
      # ⚠️ 切勿把这个端口直接转发到公网——它说的是 HTTP 明文，登录密码会裸奔。
      #
      # 公网部署的正确做法：在 .env 里设 DESIGNKIT_BIND_HOST=127.0.0.1
      #（让 8787 只监听本机），前面用 Nginx / Caddy 配好 HTTPS 再转发进来；
      # 同时把 .env 里的 DESIGNKIT_TRUSTED_PROXY_HOPS 按反代层数填上（一层填 1），
      # 否则限速看到的是反代自己的地址，全站所有人共用一个桶。
      # 完整清单见 README 第五章「公网服务器上必须做的四件事」。
      - "${DESIGNKIT_BIND_HOST:-0.0.0.0}:${DESIGNKIT_HOST_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 探活时真的往数据库跑一趟：进程活着但连不上库时，页面只会一直转圈不报错，
      # 有了它 `docker compose ps` 会直接显示 unhealthy，一眼看出问题在哪。
      # 注意 Docker 不会自动重启 unhealthy 的容器（restart 只管进程真的退出），
      # 看到 unhealthy 需要自己查日志。
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # 停容器时多等 30 秒再强杀（Docker 默认只等 10 秒）。
    # 生图任务单张要跑 1~5 分钟，被硬杀的任务会停在「生成中」不动，
    # 要等 75 分钟后重启服务才会自动回到队列（services/worker.py 的 STUCK_RESET_SECONDS）。
    # 30 秒等不完一整张图，但足够让已经出好的那几张把图片写盘、把任务状态和回调
    # 写进数据库——不至于「钱花了、图却没落地，界面上还一直转圈」。
    # 嫌升级时停容器慢可以调小，代价就是上面这一段。
    stop_grace_period: 30s
    # 容器真的退出了（崩溃、NAS 重启、断电恢复）才会自动拉起。
    # 两点注意：① unhealthy 不触发重启，见上面 healthcheck 的说明；
    # ② 启动期一旦抛异常就会变成无限重启，运营同学连界面都进不去，
    #    所以启动阶段的失败一律不许挡住启动（services/worker.py、backfill.py 都为此兜了底）。
    restart: always

  db:
    container_name: designkit_db
    image: postgres:16-alpine
    environment:
      # 故意不给默认密码：没设置就直接启动失败，避免默认弱口令被带上生产
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-designkit}
      POSTGRES_DB: ${POSTGRES_DB:-designkit}
    volumes:
      # 数据库用 docker 卷而不是绑定目录：PostgreSQL 要求数据目录权限是 0700，
      # 而 NAS 共享文件夹常带 ACL，绑定后 initdb 会以「目录权限过于开放」直接拒绝启动。
      # 备份不受影响——PG 本来就必须用 pg_dump 备份，拷文件夹是拷不出一致快照的。
      #
      # 注意：成员账号和他们的网关 Key（密文）都在这个库里。
      # 「只拷 data 目录」备不到它们，必须 pg_dump；反过来「只 pg_dump」也不够，
      # 解密钥匙在 data/.enc_key。两样缺一，恢复出来就是「全体都不能生图」。
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 必须带 -h 走 TCP：不加的话 initdb 阶段的临时本地服务也会被判为健康，
      # 应用会在数据库真正就绪前抢跑，首次建表失败
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # 数据库只在 compose 内部网络可达，不对外开端口。
    # 数据库掉了自动拉起。上面应用侧的 depends_on 只保证「首次启动的先后顺序」，
    # 数据库中途重启不会连带重启应用——应用自己会重连（连接池开了 pool_pre_ping）。
    restart: always

volumes:
  pgdata:
